<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>夜魔文化 · 专辑领取</title>
  <link rel="stylesheet" href="style-ui.css" />
</head>
<body>

<div class="nav">
  <div class="logo">🩸 夜魔文化</div>
</div>

<div class="main" style="text-align:center;">
  <img id="cover" style="width:260px;border-radius:16px;margin-top:30px;" />
  <h1 id="title" style="margin-top:20px;"></h1>
  <p id="label" style="color:#888;"></p>

  <audio id="player" controls style="margin-top:30px;width:80%;"></audio>

  <p style="margin-top:30px;color:#555;font-size:13px;">
    本专辑由 <strong>夜魔文化</strong> 发行，仅限领取人收听
  </p>
</div>

<div class="footer">© 夜魔文化 Yemo Culture</div>

<script>
const token = new URLSearchParams(location.search).get("token");

fetch(`/api/claim/${token}`)
  .then(r => r.json())
  .then(d => {
    document.getElementById("title").textContent = d.title;
    document.getElementById("label").textContent = "厂牌：" + d.label;
    document.getElementById("cover").src = d.coverUrl;
    document.getElementById("player").src = d.audioUrl;
  });
</script>

</body>
</html>
